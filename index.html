<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天吃什麼？美食決策器</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Confetti 禮花特效套件 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- FontAwesome 圖示套件 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes pulse-bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .animate-bounce-custom {
            animation: pulse-bounce 0.4s infinite;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-amber-50 via-orange-50 to-red-50 min-h-screen font-sans text-gray-800">

    <div class="max-w-md mx-auto p-4 sm:p-6">
        <!-- 頁面標頭 -->
        <header class="text-center my-6">
            <h1 class="text-3xl font-extrabold text-orange-600 flex items-center justify-center gap-2">
                <i class="fa-solid fa-utensils"></i> 今天吃什麼？
            </h1>
            <p class="text-sm text-gray-500 mt-1">智慧營業時間過濾 • Google 地圖連動</p>
        </header>

        <!-- 主抽籤顯示區域 -->
        <div class="bg-white rounded-3xl shadow-xl p-6 text-center border border-orange-100 relative overflow-hidden mb-6">
            <div id="display-card" class="py-6 my-2 bg-amber-50 rounded-2xl border-2 border-dashed border-amber-300 flex flex-col items-center justify-center min-h-[160px] transition-all">
                <span id="food-icon" class="text-5xl mb-2">🍽️</span>
                <span id="food-result" class="text-2xl font-bold text-gray-700">準備好了嗎？</span>
                
                <div class="flex items-center gap-2 mt-2">
                    <span id="food-tag" class="text-xs text-orange-600 bg-orange-100 px-2.5 py-0.5 rounded-full hidden">標籤</span>
                    <span id="food-status" class="text-xs px-2 py-0.5 rounded-full hidden">營業狀態</span>
                </div>

                <!-- Google 地圖搜尋按鈕 -->
                <a id="gmap-btn" href="#" target="_blank" class="mt-3 text-xs bg-blue-500 hover:bg-blue-600 text-white font-semibold px-3 py-1.5 rounded-lg flex items-center gap-1.5 shadow hidden transition">
                    <i class="fa-solid fa-map-location-dot"></i> 在 Google 地圖查看
                </a>
            </div>

            <!-- 條件篩選選單 -->
            <div class="grid grid-cols-2 gap-2 my-3 text-left">
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">餐點類型</label>
                    <select id="category-filter" class="w-full text-sm border border-gray-200 rounded-lg p-2 focus:ring-2 focus:ring-orange-400 outline-none">
                        <option value="all">全部類型</option>
                        <option value="正餐">🍱 正餐/主食</option>
                        <option value="小吃">🥟 街頭小吃</option>
                        <option value="速食">🍔 漢堡速食</option>
                        <option value="宵夜">🌙 夜市宵夜</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">預算範圍</label>
                    <select id="budget-filter" class="w-full text-sm border border-gray-200 rounded-lg p-2 focus:ring-2 focus:ring-orange-400 outline-none">
                        <option value="all">不限預算</option>
                        <option value="$">百元有找 ($)</option> <option value="$$">平價美味 ($$)</option> <option value="$$$">大餐享受 ($$$)</option>
                    </select>
                </div>
            </div>

            <!-- 營業時間自動篩選開關 -->
            <div class="flex items-center justify-between bg-orange-50 p-3 rounded-xl mb-4 border border-orange-100">
                <div class="flex items-center gap-2">
                    <i class="fa-regular fa-clock text-orange-500"></i>
                    <span class="text-xs font-bold text-gray-700">自動過濾非營業時間</span>
                </div>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="open-only-toggle" class="sr-only peer" checked>
                    <div class="w-9 h-5 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-orange-500"></div>
                </label>
            </div>

            <!-- 抽籤按鈕 -->
            <button id="spin-btn" onclick="spinFood()" class="w-full bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-bold py-3.5 px-6 rounded-2xl shadow-lg transform active:scale-95 transition text-lg flex items-center justify-center gap-2">
                <i class="fa-solid fa-dice"></i> 幫我決定！
            </button>
        </div>

        <!-- 功能分頁切換按鈕 -->
        <div class="flex border-b border-gray-200 mb-4">
            <button onclick="switchTab('custom')" id="tab-custom" class="flex-1 py-2 text-center font-bold text-orange-600 border-b-2 border-orange-500 text-sm">
                <i class="fa-solid fa-list-check"></i> 店家與營業時間
            </button>
            <button onclick="switchTab('history')" id="tab-history" class="flex-1 py-2 text-center font-bold text-gray-400 border-b-2 border-transparent text-sm">
                <i class="fa-solid fa-clock-rotate-left"></i> 歷史紀錄
            </button>
        </div>

        <!-- 自訂菜單與營業時間面板 -->
        <div id="panel-custom" class="bg-white rounded-2xl shadow-md p-4 mb-6">
            <form onsubmit="addFood(event)" class="space-y-2 mb-4">
                <div class="flex gap-2">
                    <input type="text" id="new-food-name" placeholder="店家或美食名稱..." required class="flex-1 text-sm border border-gray-200 rounded-xl px-3 py-2 outline-none focus:ring-2 focus:ring-orange-400">
                    <select id="new-food-cat" class="text-xs border border-gray-200 rounded-xl px-2">
                        <option value="正餐">正餐</option>
                        <option value="小吃">小吃</option>
                        <option value="速食">速食</option>
                        <option value="宵夜">宵夜</option>
                    </select>
                </div>
                <div class="flex gap-2 items-center">
                    <span class="text-xs text-gray-500 flex-shrink-0">營業起訖：</span>
                    <input type="time" id="new-food-open" value="10:00" class="text-xs border border-gray-200 rounded-lg p-1.5 flex-1">
                    <span class="text-xs text-gray-400">至</span>
                    <input type="time" id="new-food-close" value="22:00" class="text-xs border border-gray-200 rounded-lg p-1.5 flex-1">
                    <button type="submit" class="bg-orange-500 text-white px-3 py-1.5 rounded-xl text-xs font-bold hover:bg-orange-600 transition flex-shrink-0">新增</button>
                </div>
            </form>

            <ul id="food-list" class="space-y-2 max-h-56 overflow-y-auto pr-1">
                <!-- 動態注入店家清單 -->
            </ul>
        </div>

        <!-- 歷史紀錄面板 -->
        <div id="panel-history" class="bg-white rounded-2xl shadow-md p-4 mb-6 hidden">
            <div class="flex justify-between items-center mb-3">
                <span class="text-xs text-gray-500">最近抽中的美食：</span>
                <button onclick="clearHistory()" class="text-xs text-red-400 hover:underline">清空紀錄</button>
            </div>
            <ul id="history-list" class="space-y-2 max-h-56 overflow-y-auto">
                <!-- 動態注入歷史紀錄 -->
            </ul>
        </div>
    </div>

    <script>
        // 預設美食與營業時間資料
        const defaultFoods = [
            { name: "永和豆漿", cat: "宵夜", budget: "$", icon: "🥟", open: "18:00", close: "10:00" },
            { name: "牛肉麵館", cat: "正餐", budget: "$$", icon: "🍜", open: "11:00", close: "20:30" }, { name: "麥當勞 24H", cat: "速食", budget: "$$", icon: "🍔", open: "00:00", close: "23:59" },
            { name: "夜市鹹酥雞", cat: "宵夜", budget: "$", icon: "🍗", open: "17:00", close: "01:00" },
            { name: "健康便當專賣", cat: "正餐", budget: "$$", icon: "🍱", open: "10:30", close: "19:30" }, { name: "日式拉麵", cat: "正餐", budget: "$$$", icon: "🍜", open: "11:30", close: "21:00" },
            { name: "傳統大腸包小腸", cat: "小吃", budget: "$", icon: "🌭", open: "14:00", close: "19:00" }
        ];

        let foods = JSON.parse(localStorage.getItem('my_foods_v2')) || defaultFoods;
        let history = JSON.parse(localStorage.getItem('food_history_v2')) || [];
        let isSpinning = false;

        document.addEventListener('DOMContentLoaded', () => {
            renderFoodList();
            renderHistory();
        });

        // 判斷目前時間是否在營業時間內（支援跨夜，例如 18:00 到 02:00）
        function checkIsOpenNow(openStr, closeStr) {
            if (!openStr || !closeStr) return true;

            const now = new Date();
            const currentMin = now.getHours() * 60 + now.getMinutes();

            const [openH, openM] = openStr.split(':').map(Number);
            const [closeH, closeM] = closeStr.split(':').map(Number);

            const openMin = openH * 60 + openM;
            const closeMin = closeH * 60 + closeM;

            if (closeMin < openMin) {
                // 跨夜營業判斷
                return currentMin >= openMin || currentMin <= closeMin;
            } else {
                // 一般日間營業判斷
                return currentMin >= openMin && currentMin <= closeMin;
            }
        }

        // 隨機抽籤邏輯
        function spinFood() {
            if (isSpinning) return;

            const catFilter = document.getElementById('category-filter').value;
            const budgetFilter = document.getElementById('budget-filter').value;
            const openOnly = document.getElementById('open-only-toggle').checked;

            // 綜合條件過濾
            let candidates = foods.filter(item => {
                const matchCat = catFilter === 'all' || item.cat === catFilter;
                const matchBudget = budgetFilter === 'all' || item.budget === budgetFilter;
                const isOpen = checkIsOpenNow(item.open, item.close);
                const matchOpen = !openOnly || isOpen;
                return matchCat && matchBudget && matchOpen;
            });

            if (candidates.length === 0) {
                alert('目前設定條件下（或此時間點）沒有正在營業的店家，請放寬篩選條件！');
                return;
            }

            isSpinning = true;
            const btn = document.getElementById('spin-btn');
            const displayCard = document.getElementById('display-card');
            const resultText = document.getElementById('food-result');
            const resultIcon = document.getElementById('food-icon');
            const resultTag = document.getElementById('food-tag');
            const resultStatus = document.getElementById('food-status');
            const gmapBtn = document.getElementById('gmap-btn');

            btn.disabled = true;
            gmapBtn.classList.add('hidden');
            displayCard.classList.add('animate-bounce-custom');

            let counter = 0;
            const totalSteps = 20;
            const interval = setInterval(() => {
                const randomTemp = candidates[Math.floor(Math.random() * candidates.length)];
                resultText.innerText = randomTemp.name;
                resultIcon.innerText = randomTemp.icon || "🎲";
                counter++;

                if (counter >= totalSteps) {
                    clearInterval(interval);
                    isSpinning = false;
                    btn.disabled = false;
                    displayCard.classList.remove('animate-bounce-custom');

                    // 確定抽中店家
                    const winner = candidates[Math.floor(Math.random() * candidates.length)];
                    const isOpen = checkIsOpenNow(winner.open, winner.close);

                    resultText.innerText = winner.name;
                    resultIcon.innerText = winner.icon || "🍱";
                    resultTag.innerText = `${winner.cat} • ${winner.budget || '平價'}`;
                    resultTag.classList.remove('hidden');

                    // 顯示營業狀態標籤
                    resultStatus.classList.remove('hidden');
                    if (isOpen) {
                        resultStatus.innerText = "🟢 營業中";
                        resultStatus.className = "text-xs px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 font-bold";
                    } else {
                        resultStatus.innerText = "🔴 已休息";
                        resultStatus.className = "text-xs px-2 py-0.5 rounded-full bg-rose-100 text-rose-700 font-bold";
                    }

                    // 設定 Google 地圖連結
                    gmapBtn.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(winner.name)}`;
                    gmapBtn.classList.remove('hidden');

                    // 呼叫禮花特效
                    confetti({ particleCount: 80, spread: 60, origin: { y: 0.6 } });

                    // 寫入歷史紀錄
                    addHistory(winner.name);
                }
            }, 80);
        }

        // 渲染店家與營業時間列表
        function renderFoodList() {
            const listEl = document.getElementById('food-list');
            listEl.innerHTML = '';
            foods.forEach((item, index) => {
                const isOpen = checkIsOpenNow(item.open, item.close);
                const li = document.createElement('li');
                li.className = 'flex justify-between items-center text-xs p-2.5 bg-gray-50 rounded-xl hover:bg-orange-50 transition border border-gray-100';
                li.innerHTML = `
                    <div class="flex flex-col">
                        <span class="font-bold text-gray-800 text-sm">${item.icon || '🍽️'} ${item.name} <span class="text-xs font-normal text-gray-400">(${item.cat})</span></span>
                        <span class="text-[11px] text-gray-500 mt-0.5">
                            ⏰ 營業時間: ${item.open || '10:00'} - ${item.close || '22:00'}
                            ${isOpen ? '<span class="text-emerald-600 font-bold ml-1">● 營業中</span>' : '<span class="text-rose-500 ml-1">● 休息中</span>'}
                        </span>
                    </div>
                    <button onclick="deleteFood(${index})" class="text-gray-300 hover:text-red-500 p-1.5 transition"><i class="fa-solid fa-trash-can"></i></button>
                `;
                listEl.appendChild(li);
            });
            localStorage.setItem('my_foods_v2', JSON.stringify(foods));
        }

        // 新增店家
        function addFood(e) {
            e.preventDefault();
            const nameInput = document.getElementById('new-food-name');
            const cat = document.getElementById('new-food-cat').value;
            const open = document.getElementById('new-food-open').value;
            const close = document.getElementById('new-food-close').value;
            const name = nameInput.value.trim();

            if (!name) return;

            foods.push({ name, cat, budget: "$$", icon: "🍱", open, close });
            nameInput.value = '';
            renderFoodList();
        }

        // 刪除店家
        function deleteFood(index) {
            foods.splice(index, 1);
            renderFoodList();
        }

        // 新增歷史紀錄
        function addHistory(name) {
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            history.unshift({ name, time });
            if (history.length > 10) history.pop();
            localStorage.setItem('food_history_v2', JSON.stringify(history));
            renderHistory();
        }

        // 渲染歷史紀錄
        function renderHistory() {
            const listEl = document.getElementById('history-list');
            listEl.innerHTML = '';
            if (history.length === 0) {
                listEl.innerHTML = '<li class="text-xs text-gray-400 text-center py-4">尚無抽取紀錄</li>';
                return;
            }
            history.forEach(item => {
                const li = document.createElement('li');
                li.className = 'text-xs p-2 bg-gray-50 rounded-lg flex justify-between text-gray-600';
                li.innerHTML = `<span>🎉 抽中了 <strong>${item.name}</strong></span><span class="text-gray-400">${item.time}</span>`;
                listEl.appendChild(li);
            });
        }

        // 清空歷史紀錄
        function clearHistory() {
            history = [];
            localStorage.removeItem('food_history_v2');
            renderHistory();
        }

        // 切換面板
        function switchTab(tab) {
            const customPanel = document.getElementById('panel-custom');
            const historyPanel = document.getElementById('panel-history');
            const customTabBtn = document.getElementById('tab-custom');
            const historyTabBtn = document.getElementById('tab-history');

            if (tab === 'custom') {
                customPanel.classList.remove('hidden');
                historyPanel.classList.add('hidden');
                customTabBtn.className = "flex-1 py-2 text-center font-bold text-orange-600 border-b-2 border-orange-500 text-sm";
                historyTabBtn.className = "flex-1 py-2 text-center font-bold text-gray-400 border-b-2 border-transparent text-sm";
            } else {
                customPanel.classList.add('hidden');
                historyPanel.classList.remove('hidden');
                historyTabBtn.className = "flex-1 py-2 text-center font-bold text-orange-600 border-b-2 border-orange-500 text-sm";
                customTabBtn.className = "flex-1 py-2 text-center font-bold text-gray-400 border-b-2 border-transparent text-sm";
            }
        }
    </script>
</body>
</html>
